<h1 style="text-align: center;" data-mce-style="text-align: center;">9. The Suldae</h1><p>The geomungo is played with a short bamboo stick called a suldae, held in the right hand.</p><p>Rather than simply plucking the strings, the player uses the suldae to strike, pluck, and brush across them, contributing to the geomungo’s distinctive rhythmic and percussive sound.</p>
