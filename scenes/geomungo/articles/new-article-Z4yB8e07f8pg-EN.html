<h1 style="text-align: center;" data-mce-style="text-align: center;">10. The Bongmi</h1><p>At the end of the geomungo is a section called the bongmi, meaning “phoenix tail.”</p><p>Its name is another example of how parts of the geomungo are described through imagery from the natural and symbolic world—much like the anjok, or “wild goose’s foot.”</p>
