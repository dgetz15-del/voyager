<h1 style="text-align: center;" data-mce-style="text-align: center;">8. The Anjok</h1><p>Three of the geomungo’s strings rest on movable bridges called anjok. Their position can be adjusted to help tune the strings by changing their vibrating length.</p><p>The name anjok means “wild goose’s foot,” a reference to the distinctive shape of the bridges.</p>
